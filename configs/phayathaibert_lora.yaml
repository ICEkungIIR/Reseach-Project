# LoRA config — PhayaThaiBERT backbone
model:
  name: "clicknext/phayathaibert"
  tokenizer: "phayathaibert"

lora:
  ranks: [4, 8, 16, 32]
  alpha_multiplier: 2       # alpha = 2 * r for every rank (fixed) -> {4:8, 8:16, 16:32, 32:64}
  target_modules: ["query", "value"]
  dropout: 0.1

training:
  learning_rate: 1e-4       # must match wangchanberta_lora.yaml value (same method -> same LR)
  fp16: true
  batch_size: 8              # must match wangchanberta_lora.yaml value
  gradient_accumulation_steps: 4   # effective batch size = 8 * 4 = 32
  weight_decay: 0.01
  epochs: 5
  seeds: [0, 1, 2]

tasks:
  - wisesight_sentiment
  - thai_ner
